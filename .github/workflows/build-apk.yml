name: Build and Export APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Generate Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Prepare APK
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output_apk/VirtualPhone-Launcher.apk \; || find . -name "*.apk" -exec cp {} output_apk/VirtualPhone-Launcher.apk \;
          echo "APK successfully built and prepared:"
          ls -la output_apk/

      - name: Upload APK to GitHub Artifacts (Download Link)
        uses: actions/upload-artifact@v4
        with:
          name: VirtualPhone-Launcher-APK
          path: output_apk/VirtualPhone-Launcher.apk
          retention-days: 30
